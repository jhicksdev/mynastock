name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install myna-lang==0.4.2
      - run: make zipapp
      - run: |
          cp build/mynastock.pyz mynastock.pyz
          sha256sum mynastock.pyz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            mynastock.pyz \
            SHA256SUMS \
            docs/api/openapi.json \
            --title "MynaStock $GITHUB_REF_NAME" \
            --generate-notes
