name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install myna-lang==0.4.2
      - run: make lint

  test-py:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install myna-lang==0.4.2 ruff
      - run: make test-py
      - run: make lint-py RUFF=ruff
      - run: make selftest
      - run: make zipapp-smoke

  test-js:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install myna-lang==0.4.2
      - run: make test-js
      - run: make demo-smoke
      - run: make site

  check:
    if: always()
    needs: [lint, test-py, test-js]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test-py.result }}" = "success"
          test "${{ needs.test-js.result }}" = "success"
